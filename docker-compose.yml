services:
  # --- KAFKA & ZOOKEEPER (Mensajería) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: synapse-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - synapse-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: synapse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://synapse-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - synapse-net

  # --- REDIS (Caché y Sesiones) ---
  redis:
    image: redis:alpine
    container_name: synapse-redis
    ports:
      - "6379:6379"
    networks:
      - synapse-net
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - ./redis-data:/data

  # --- VAULT (Gestión de Secretos) ---
  vault:
    image: hashicorp/vault:1.15
    container_name: synapse-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_TOKEN}"
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_UI: "true" # Activa la interfaz gráfica
    cap_add:
      - IPC_LOCK
    networks:
      - synapse-net


networks:
  synapse-net:
    name: synapse-net
    driver: bridge